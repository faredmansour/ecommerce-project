services:
  frontend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY to the ECR registry URI}/alfredo-frontend:${IMAGE_TAG:?Set IMAGE_TAG to an immutable git commit SHA}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_PREVIEW_MODE: "true"
    container_name: alfredo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY to the ECR registry URI}/alfredo-backend:${IMAGE_TAG:?Set IMAGE_TAG to an immutable git commit SHA}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfredo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      PREVIEW_MODE: "true"
      PAYMENT_WEBHOOK_SHUTDOWN_TIMEOUT_MS: 10000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DB_URL: ${DB_URL:?Set DB_URL to a dedicated preview database}
      CLIENT_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
      FRONTEND_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
      PAYMOB_ENVIRONMENT: TEST
      PAYMOB_TEST_EXECUTION_ENABLED: "false"
      PAYMOB_TEST_TRANSACTION_INQUIRY_ENABLED: "false"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
