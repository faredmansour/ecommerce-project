name: E-commerce Test Lab Validation

on:
  pull_request:
    branches:
      - feat/aws-testlab-deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend install and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm version used by container builds
        run: |
          npm install --global npm@11.6.2
          node --version
          npm --version

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

  frontend:
    name: Frontend install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: backend
            path: backend
          - project: frontend
            path: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Apply compatible security fixes to lockfile
        working-directory: ${{ matrix.path }}
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          echo "LOCKFILE_BASE64=$(base64 -w0 package-lock.json)"

      - name: Install locked dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Report advisories without changing dependencies
        working-directory: ${{ matrix.path }}
        env:
          AUDIT_FILE: ${{ runner.temp }}/${{ matrix.project }}-audit.json
        run: |
          npm audit --json > "$AUDIT_FILE" || true
          node -e '
            const fs = require("node:fs");
            const audit = JSON.parse(fs.readFileSync(process.env.AUDIT_FILE, "utf8"));
            const entries = Object.entries(audit.vulnerabilities || {});
            console.log("Project:", process.env.PROJECT_NAME || "dependency audit");
            console.log("Counts:", JSON.stringify(audit.metadata?.vulnerabilities || {}));
            for (const [name, item] of entries) {
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                via: (item.via || []).map((entry) =>
                  typeof entry === "string" ? entry : {
                    name: entry.name,
                    title: entry.title,
                    range: entry.range,
                    url: entry.url
                  }),
                fixAvailable: item.fixAvailable
              }));
            }
          '

  docker:
    name: Build Docker images without pushing
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: ecommerce-backend:validation

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ecommerce-frontend:validation
          build-args: |
            VITE_API_URL=
