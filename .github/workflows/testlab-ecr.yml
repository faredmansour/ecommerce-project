name: Build and push E-commerce images to Test Lab ECR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecommerce-testlab-ecr
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push frontend/backend
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: dcc-testlab-use1-ecommerce
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:backend-${{ github.sha }}
          cache-from: type=gha,scope=ecommerce-backend
          cache-to: type=gha,mode=max,scope=ecommerce-backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:frontend-${{ github.sha }}
          cache-from: type=gha,scope=ecommerce-frontend
          cache-to: type=gha,mode=max,scope=ecommerce-frontend

      - name: Print image references
        run: |
          echo "backend_tag=backend-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "frontend_tag=frontend-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  configuration-required:
    name: AWS OIDC configuration required
    if: ${{ vars.AWS_ROLE_ARN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain required repository variable
        run: |
          echo "Set repository variable AWS_ROLE_ARN to the IAM role ARN trusted for this repository via GitHub OIDC."
          echo "No image was built or pushed."
          exit 1
